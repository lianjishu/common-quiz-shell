<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Style 3 — 手绘线稿风</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F5F1E8;
  --paper-2: #FBF7EC;
  --ink: #2B2417;
  --ink-2: #5C4F3A;
  --orange: #D97706;
  --green: #65A30D;
  --red: #B91C1C;
  --yellow: #FEF3C7;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Patrick Hand', 'Caveat', cursive;
  background: var(--paper);
  color: var(--ink);
  padding: 32px;
  font-size: 17px;
  line-height: 1.6;
  background-image:
    repeating-linear-gradient(transparent 0 31px, rgba(43,36,23,0.05) 31px 32px);
  min-height: 100vh;
}
.demo-label {
  font-family: 'Caveat', cursive;
  font-size: 30px;
  font-weight: 700;
  color: var(--orange);
  margin-bottom: 28px;
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
  display: block;
  border-bottom: 2px dashed var(--ink-2);
  padding-bottom: 6px;
  transform: rotate(-0.8deg);
  width: fit-content;
}
.layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 32px;
  max-width: 900px;
  margin: 0 auto;
}
.sidebar {
  background: var(--paper-2);
  border: 2.5px solid var(--ink);
  border-radius: 6px 22px 8px 26px / 22px 8px 26px 6px;
  padding: 20px;
  height: fit-content;
  transform: rotate(-0.6deg);
  box-shadow: 4px 5px 0 rgba(43,36,23,0.18);
}
.sidebar h3 {
  font-family: 'Caveat', cursive;
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 16px;
  text-decoration: underline;
  text-decoration-style: wavy;
  text-decoration-color: var(--orange);
  text-underline-offset: 5px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  color: var(--ink-2);
  cursor: pointer;
  font-size: 17px;
  margin-bottom: 4px;
  border-radius: 4px 14px 4px 14px;
  border: 2px solid transparent;
  transition: all 120ms;
}
.nav-item::before {
  content: '✦';
  color: var(--orange);
  font-family: 'Caveat', cursive;
}
.nav-item.active {
  background: var(--yellow);
  border: 2px solid var(--ink);
  color: var(--ink);
  font-weight: 700;
}
.nav-item:hover:not(.active) { background: rgba(217,119,6,0.08); }
.main { min-width: 0; }
.progress {
  height: 14px;
  background: var(--paper-2);
  border: 2.5px solid var(--ink);
  border-radius: 4px 14px 4px 14px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--orange);
  width: 32%;
  background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,0.5) 5px 6px);
}
.q-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 16px;
  margin-bottom: 14px;
  color: var(--ink-2);
}
.q-type {
  border: 2px solid var(--ink);
  padding: 3px 12px;
  border-radius: 16px 4px 16px 4px;
  font-size: 15px;
  background: var(--yellow);
  transform: rotate(2deg);
  display: inline-block;
}
.q-card {
  background: var(--paper-2);
  border: 2.5px solid var(--ink);
  border-radius: 10px 26px 10px 26px / 26px 10px 26px 10px;
  padding: 28px;
  transform: rotate(0.4deg);
  box-shadow: 4px 6px 0 rgba(43,36,23,0.18);
}
.q-title {
  font-family: 'Caveat', cursive;
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 24px;
  line-height: 1.3;
}
.option {
  border: 2.5px solid var(--ink);
  border-radius: 6px 18px 6px 18px / 18px 6px 18px 6px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  cursor: pointer;
  background: var(--paper-2);
  transition: all 120ms;
}
.option:nth-child(2) { transform: rotate(0.3deg); border-radius: 18px 6px 18px 6px / 6px 18px 6px 18px; }
.option:nth-child(3) { transform: rotate(-0.2deg); }
.option:nth-child(4) { transform: rotate(0.4deg); border-radius: 18px 6px 18px 6px / 6px 18px 6px 18px; }
.option:hover { transform: rotate(0deg) scale(1.01); }
.option-letter {
  width: 30px;
  height: 30px;
  border: 2.5px solid var(--ink);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Caveat', cursive;
  font-weight: 700;
  font-size: 19px;
  flex-shrink: 0;
  background: var(--paper);
}
.option.correct {
  background: #ECFCCB;
  border-color: var(--green);
}
.option.correct .option-letter {
  background: var(--green);
  color: white;
  border-color: var(--green);
}
.option.wrong {
  background: #FEE2E2;
  border-color: var(--red);
}
.option.wrong .option-letter {
  background: var(--red);
  color: white;
  border-color: var(--red);
}
.feedback {
  margin-top: 22px;
  padding: 14px 16px;
  background: #ECFCCB;
  border: 2.5px dashed var(--green);
  border-radius: 16px 4px 16px 4px;
  font-size: 17px;
  color: var(--ink);
  transform: rotate(-0.3deg);
}
.feedback strong { color: var(--green); font-family: 'Caveat', cursive; font-size: 22px; }
.actions {
  display: flex;
  gap: 12px;
  margin-top: 24px;
  justify-content: space-between;
}
.btn {
  border: 2.5px solid var(--ink);
  background: var(--paper-2);
  padding: 10px 22px;
  font-family: 'Caveat', cursive;
  font-size: 21px;
  font-weight: 700;
  cursor: pointer;
  border-radius: 8px 18px 8px 18px / 18px 8px 18px 8px;
  box-shadow: 3px 3px 0 rgba(43,36,23,0.2);
  transition: all 120ms;
  color: var(--ink);
}
.btn:hover { transform: translate(-2px, -2px) rotate(-1deg); box-shadow: 5px 5px 0 rgba(43,36,23,0.25); }
.btn-primary {
  background: var(--orange);
  color: white;
  border-color: var(--ink);
}
</style>
</head>
<body>
<div class="demo-label">Style 3 · Sketch · 手绘线稿 ✏</div>
<div class="layout">
  <aside class="sidebar">
    <h3>题型筛选</h3>
    <div class="nav-item active">全部题目</div>
    <div class="nav-item">单选题</div>
    <div class="nav-item">填空题</div>
    <div class="nav-item">判断题</div>
    <div class="nav-item">简答题</div>
  </aside>
  <main class="main">
    <div class="progress"><div class="progress-fill"></div></div>
    <div class="q-meta">
      <span>第 12 题 / 共 350 题</span>
      <span class="q-type">单选题</span>
    </div>
    <div class="q-card">
      <div class="q-title">CPU 内部完成算术逻辑运算的部件是？</div>
      <div class="option">
        <span class="option-letter">A</span>
        <span>控制器 (CU)</span>
      </div>
      <div class="option correct">
        <span class="option-letter">B</span>
        <span>算术逻辑单元 (ALU)</span>
      </div>
      <div class="option">
        <span class="option-letter">C</span>
        <span>存储器 (Memory)</span>
      </div>
      <div class="option wrong">
        <span class="option-letter">D</span>
        <span>寄存器组 (Register File)</span>
      </div>
      <div class="feedback">
        <strong>答对了！</strong> ALU 即算术逻辑单元，是 CPU 内专门执行算术与逻辑运算的部件。
      </div>
      <div class="actions">
        <button class="btn">← 上一题</button>
        <button class="btn btn-primary">下一题 →</button>
      </div>
    </div>
  </main>
</div>
</body>
</html>
