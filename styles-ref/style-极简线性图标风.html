<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Style 1 — 极简线性图标风</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFFFFF;
  --text: #111827;
  --text-2: #6B7280;
  --border: #E5E7EB;
  --border-strong: #111827;
  --accent: #2563EB;
  --correct: #059669;
  --wrong: #DC2626;
  --hover: #F9FAFB;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 32px;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.demo-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-2);
  margin-bottom: 24px;
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}
.layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 32px;
  max-width: 900px;
  margin: 0 auto;
}
.sidebar {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  height: fit-content;
}
.sidebar h3 {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--text);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  color: var(--text-2);
  cursor: pointer;
  font-size: 13px;
  margin-bottom: 2px;
  transition: all 120ms ease;
}
.nav-item:hover { background: var(--hover); color: var(--text); }
.nav-item.active {
  background: var(--hover);
  color: var(--text);
  font-weight: 500;
}
.nav-item svg { width: 16px; height: 16px; stroke-width: 1.5; flex-shrink: 0; }
.main { min-width: 0; }
.progress {
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--text);
  border-radius: 1px;
  width: 32%;
  transition: width 300ms ease;
}
.q-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--text-2);
  margin-bottom: 12px;
}
.q-type {
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text);
}
.q-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px;
  background: var(--bg);
}
.q-title {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 24px;
  line-height: 1.5;
  letter-spacing: -0.01em;
}
.option {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 120ms ease;
  font-size: 14px;
}
.option:hover { background: var(--hover); border-color: var(--text-2); }
.option-letter {
  width: 22px;
  height: 22px;
  border: 1px solid var(--border-strong);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
}
.option.correct {
  border-color: var(--correct);
  background: #ECFDF5;
}
.option.correct .option-letter {
  border-color: var(--correct);
  background: var(--correct);
  color: white;
}
.option.wrong {
  border-color: var(--wrong);
  background: #FEF2F2;
}
.option.wrong .option-letter {
  border-color: var(--wrong);
  background: var(--wrong);
  color: white;
}
.feedback {
  margin-top: 20px;
  padding: 14px 16px;
  border-radius: 8px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 13px;
  background: #ECFDF5;
  color: #065F46;
  border: 1px solid #A7F3D0;
}
.feedback svg { width: 16px; height: 16px; flex-shrink: 0; stroke-width: 2; margin-top: 1px; }
.feedback strong { color: var(--correct); }
.actions {
  display: flex;
  gap: 8px;
  margin-top: 24px;
  justify-content: space-between;
}
.btn {
  border: 1px solid var(--border);
  background: var(--bg);
  padding: 9px 18px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
  color: var(--text);
  transition: all 120ms ease;
}
.btn:hover { border-color: var(--border-strong); }
.btn-primary {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}
.btn-primary:hover { background: #000; border-color: #000; }
.btn svg { width: 14px; height: 14px; stroke-width: 1.5; }
</style>
</head>
<body>
<div class="demo-label">Style 1 · Linear Outline · 极简线性图标风</div>
<div class="layout">
  <aside class="sidebar">
    <h3>题型筛选</h3>
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 12l2 2 4-4"/></svg>
      全部题目
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      单选题
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      填空题
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12l4 4 10-10"/></svg>
      判断题
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16v12H4z M8 10h8 M8 14h5"/></svg>
      简答题
    </div>
  </aside>
  <main class="main">
    <div class="progress"><div class="progress-fill"></div></div>
    <div class="q-meta">
      <span>第 12 题 / 共 350 题</span>
      <span class="q-type">单选题</span>
    </div>
    <div class="q-card">
      <div class="q-title">在计算机组成原理中，CPU 内部完成算术逻辑运算的部件是？</div>
      <div class="option">
        <span class="option-letter">A</span>
        <span>控制器 (CU)</span>
      </div>
      <div class="option correct">
        <span class="option-letter">B</span>
        <span>算术逻辑单元 (ALU)</span>
      </div>
      <div class="option">
        <span class="option-letter">C</span>
        <span>存储器 (Memory)</span>
      </div>
      <div class="option wrong">
        <span class="option-letter">D</span>
        <span>寄存器组 (Register File)</span>
      </div>
      <div class="feedback">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12l4 4 10-10"/></svg>
        <div><strong>回答正确！</strong> ALU 即算术逻辑单元，是 CPU 内专门执行算术与逻辑运算的部件。</div>
      </div>
      <div class="actions">
        <button class="btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 18l-6-6 6-6"/></svg>
          上一题
        </button>
        <button class="btn btn-primary">
          下一题
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>
</body>
</html>
