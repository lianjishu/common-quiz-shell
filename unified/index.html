<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算机组成原理 · 模拟题练习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Patrick+Hand&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="theme.css">
</head>
<body data-theme="default">

<div class="app">
  <aside class="sidebar">
    <h1>
      计组 · 模拟题
      <span>Computer Organization Quiz</span>
    </h1>
    <button class="filter-btn active" data-filter="全部">全部 <span class="count" id="count-all"></span></button>
    <button class="filter-btn" data-filter="单选题">单选题 <span class="count" id="count-单选题"></span></button>
    <button class="filter-btn" data-filter="填空题">填空题 <span class="count" id="count-填空题"></span></button>
    <button class="filter-btn" data-filter="判断题">判断题 <span class="count" id="count-判断题"></span></button>
    <button class="filter-btn" data-filter="简答题">简答题 <span class="count" id="count-简答题"></span></button>
    <div class="sidebar-divider"></div>
    <button class="filter-btn" data-filter="错题">错题回顾 <span class="count" id="count-wrong"></span></button>
    <div class="stats">
      <h3>// 统计</h3>
      <div class="stat-row">
        <span class="label">已做</span>
        <span class="value" id="stat-done">0 / 0</span>
      </div>
      <div class="stat-row">
        <span class="label">正确</span>
        <span class="value correct" id="stat-correct">0</span>
      </div>
      <div class="stat-row">
        <span class="label">错误</span>
        <span class="value wrong" id="stat-wrong">0</span>
      </div>
      <div class="stat-row">
        <span class="label">正确率</span>
        <span class="value" id="stat-rate">--%</span>
      </div>
      <div class="stats-actions">
        <button class="stats-btn" onclick="shuffleToggle()">随机顺序</button>
        <button class="stats-btn danger" onclick="resetProgress()">重置进度</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="top-bar">
      <div class="progress-wrap">
        <div class="progress-info">
          <span id="progress-text">第 1 题 / 350</span>
          <span id="progress-pct">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>
      <button class="shuffle-btn" id="shuffle-btn" onclick="shuffleToggle()">Shuffle</button>
      <div class="theme-switcher">
        <button class="theme-trigger" id="theme-trigger" type="button" aria-label="切换主题">
          <span class="theme-dot" id="theme-dot"></span>
          <span class="theme-label" id="theme-label">原版</span>
          <span class="theme-caret">▾</span>
        </button>
        <div class="theme-popover" id="theme-popover" role="menu">
          <!-- 主题选项由 JS 渲染 -->
        </div>
      </div>
    </div>

    <div class="question-card" id="question-card">
      <!-- Rendered by JS -->
    </div>

    <div class="kbd-hints">
      <span><kbd>1</kbd>-<kbd>4</kbd> 选择选项</span>
      <span><kbd>Enter</kbd> 下一题 / 提交</span>
      <span><kbd>Space</kbd> 显示答案(简答)</span>
    </div>
  </main>

  <aside class="answer-sheet">
    <div class="sheet-header">
      <h3>// 答题卡 Answer Sheet</h3>
    </div>
    <div class="sheet-toolbar" id="sheet-toolbar">
      <button class="chip active" data-type="all">全部</button>
      <button class="chip" data-type="单选题">单选</button>
      <button class="chip" data-type="填空题">填空</button>
      <button class="chip" data-type="判断题">判断</button>
      <button class="chip" data-type="简答题">简答</button>
    </div>
    <div class="sheet-grid" id="sheet-grid"></div>
    <div class="sheet-legend">
      <span><i class="lg-empty"></i>未答</span>
      <span><i class="lg-correct"></i>正确</span>
      <span><i class="lg-wrong"></i>错误</span>
    </div>
  </aside>
</div>

<script src="questions.js"></script>
<script src="app.js"></script>
<script src="theme.js"></script>
</body>
</html>
